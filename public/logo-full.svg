<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- Plus Sign (Medical Cross) -->
  <g id="plus">
    <!-- Vertical bar -->
    <rect x="320" y="150" width="90" height="280" fill="#2E7DB8" rx="10"/>
    <!-- Horizontal bar -->
    <rect x="200" y="270" width="330" height="90" fill="#2E7DB8" rx="10"/>
  </g>
  
  <!-- Wrench/Tool Body -->
  <g id="wrench">
    <!-- Top horizontal line of wrench -->
    <line x1="530" y1="215" x2="800" y2="215" stroke="#2E7DB8" stroke-width="90" stroke-linecap="round"/>
    
    <!-- Right curved part of wrench (rounded rectangle) -->
    <path d="M 730 170 Q 800 170 830 215 Q 830 270 800 305 Q 730 305 730 270 Z" fill="#2E7DB8"/>
    
    <!-- Bottom part of wrench opening -->
    <path d="M 380 380 Q 420 420 520 420 Q 620 420 680 390" fill="none" stroke="#2E7DB8" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner white space (wrench opening) -->
    <ellipse cx="520" cy="320" rx="180" ry="140" fill="white"/>
  </g>
  
  <!-- Text: BIONIC COMPUTER -->
  <text x="50" y="550" font-family="'Courier New', 'Courier', monospace" font-size="100" font-weight="900" fill="white" letter-spacing="20">BIONIC COMPUTER</text>
  
  <!-- Tagline: WE CARE YOUR SYSTEM -->
  <text x="50" y="640" font-family="'Courier New', 'Courier', monospace" font-size="45" font-weight="400" fill="white" letter-spacing="8" font-style="italic">WE CARE YOUR SYSTEM</text>
  
  <!-- Decorative lines -->
  <line x1="50" y1="575" x2="950" y2="575" stroke="#2E7DB8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="660" x2="950" y2="660" stroke="#2E7DB8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
