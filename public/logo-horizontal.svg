<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250">
  <!-- Plus Sign -->
  <g id="plus">
    <!-- Vertical bar -->
    <rect x="220" y="40" width="55" height="170" fill="#2E7DB8" rx="6"/>
    <!-- Horizontal bar -->
    <rect x="130" y="100" width="235" height="55" fill="#2E7DB8" rx="6"/>
  </g>
  
  <!-- Wrench/Tool Body -->
  <g id="wrench">
    <!-- Top horizontal line -->
    <line x1="390" y1="75" x2="580" y2="75" stroke="#2E7DB8" stroke-width="60" stroke-linecap="round"/>
    
    <!-- Right curved part -->
    <path d="M 540 55 Q 590 55 610 85 Q 610 130 580 155 Q 540 155 540 130 Z" fill="#2E7DB8"/>
    
    <!-- Bottom curved part of wrench -->
    <path d="M 280 190 Q 310 220 420 220 Q 500 220 540 200" fill="none" stroke="#2E7DB8" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner opening (white cutout) -->
    <ellipse cx="420" cy="130" rx="120" ry="90" fill="white"/>
  </g>
  
  <!-- Text: BIONIC COMPUTER -->
  <text x="680" y="145" font-family="'Courier New', monospace" font-size="80" font-weight="900" fill="white" letter-spacing="12">BIONIC COMPUTER</text>
  
  <!-- Decorative line -->
  <line x1="680" y1="160" x2="1180" y2="160" stroke="#2E7DB8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
